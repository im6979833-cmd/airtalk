<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AirTalk</title>

<style>
*{box-sizing:border-box;}

body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
background:#0e1621;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.app{
width:420px;
height:520px;
background:#17212b;
border-radius:25px;
display:flex;
flex-direction:column;
overflow:hidden;
box-shadow:0 40px 80px rgba(0,0,0,.6);
position:relative;
}

.sidebar{
position:absolute;
right:-220px;
top:70px;
width:220px;
height:74%;
background:#111827;
transition:.3s;
padding:15px;
color:white;
overflow-y:auto;
z-index:10;
}

.sidebar.active{
right:0;
}

.sidebar h3{
margin-top:0;
font-size:15px;
}

.user{
padding:8px;
border-radius:10px;
background:#1f2937;
margin-bottom:8px;
font-size:13px;
}

.header{
height:70px;
background:#242f3d;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 15px;
}

.header-left{
display:flex;
align-items:center;
gap:12px;
}

.avatar{
width:45px;
height:45px;
border-radius:50%;
background:#0ea5e9;
display:flex;
justify-content:center;
align-items:center;
font-weight:bold;
color:white;
}

.username{color:white;font-weight:600;}
.status{font-size:13px;color:#4ade80;}

.sidebar-toggle{
width:40px;
height:40px;
border-radius:10px;
border:none;
background:#1f2937;
color:white;
font-size:18px;
cursor:pointer;
display:flex;
justify-content:center;
align-items:center;
}

.chat{
flex:1;
padding:20px;
overflow-y:auto;
display:flex;
flex-direction:column;
gap:10px;
background:#0e1621;
}

.message{
max-width:75%;
padding:10px 14px;
border-radius:18px;
font-size:14px;
line-height:1.4;
color:white;
}

.me{
background:#2b5278;
align-self:flex-end;
border-bottom-right-radius:5px;
}

.other{
background:#182533;
align-self:flex-start;
border-bottom-left-radius:5px;
}

.time{
font-size:10px;
opacity:.6;
margin-top:5px;
text-align:right;
}

.input-area{
background:#242f3d;
padding:10px;
display:flex;
gap:10px;
}

input{
flex:1;
padding:12px 15px;
border-radius:25px;
border:none;
background:#17212b;
color:white;
}

.send-btn{
width:45px;
height:45px;
border-radius:50%;
border:none;
background:#0ea5e9;
color:white;
cursor:pointer;
}

.call-card{
background:#1f2937;
padding:15px;
border-radius:15px;
display:flex;
flex-direction:column;
gap:8px;
color:white;
font-size:14px;
}

.call-row{
display:flex;
justify-content:space-between;
align-items:center;
}

.call-btn-small{
padding:6px 12px;
border:none;
border-radius:10px;
cursor:pointer;
color:white;
}

.accept{background:#22c55e;}
.decline{background:#ef4444;}
.end{background:#ef4444;}
</style>
</head>

<body>

<div class="app">

<div class="sidebar" id="sidebar">
<h3>Online Users</h3>
<div id="userList"></div>
</div>

<div class="header">
<div class="header-left">
<div class="avatar">P</div>
<div>
<div class="username">Privatni Razgovori</div>
<div class="status">● Na Mreži</div>
</div>
</div>
<button class="sidebar-toggle" onclick="toggleSidebar()">☰</button>
</div>

<div id="chat" class="chat"></div>

<div class="input-area">
<img src="call.png" onclick="startCall()" style="width:40px;cursor:pointer;">
<input id="messageInput" placeholder="Write a message..."
onkeypress="if(event.key==='Enter') sendMessage()">
<button class="send-btn" onclick="sendMessage()">➤</button>
</div>

</div>

<audio id="remoteAudio" autoplay playsinline></audio>
<audio id="ringing" src="kadjazovem.mp3"></audio>
<audio id="incomingRing" src="kadprimampoziv.mp3"></audio>
<audio id="sentSound" src="poslano.mp3"></audio>
<audio id="receivedSound" src="primljeno.mp3"></audio>

<script src="/socket.io/socket.io.js"></script>
<script>

const socket = io();

let pc=null;
let localStream=null;
let timerInterval=null;
let callSeconds=0;
let currentCallCard=null;

const sidebar=document.getElementById("sidebar");
const userList=document.getElementById("userList");
const remoteAudio=document.getElementById("remoteAudio");
const ringing=document.getElementById("ringing");
const incomingRing=document.getElementById("incomingRing");
const sentSound=document.getElementById("sentSound");
const receivedSound=document.getElementById("receivedSound");

function toggleSidebar(){
sidebar.classList.toggle("active");
}

socket.on("online-users",(users)=>{
userList.innerHTML="";
users.forEach(u=>{
const div=document.createElement("div");
div.className="user";
div.textContent=u.name;
userList.appendChild(div);
});
});

function sendMessage(){
const input=document.getElementById("messageInput");
if(!input.value)return;
addMessage(input.value,true);
sentSound.play();
socket.emit("chat-message",input.value);
input.value="";
}

socket.on("chat-message",(msg)=>{
receivedSound.play();
addMessage(msg,false);
});

function addMessage(text,isMe){
const chat=document.getElementById("chat");
const wrapper=document.createElement("div");
wrapper.className="message "+(isMe?"me":"other");
wrapper.innerHTML=text+"<div class='time'>"+
new Date().toLocaleTimeString([],{
hour:"2-digit",minute:"2-digit"
})+"</div>";
chat.appendChild(wrapper);
chat.scrollTop=chat.scrollHeight;
}

const config={iceServers:[{urls:"stun:stun.l.google.com:19302"}]};

async function initMedia(){
if(!localStream){
localStream=await navigator.mediaDevices.getUserMedia({audio:true});
}
}

function createPC(){
pc=new RTCPeerConnection(config);

pc.onicecandidate=e=>{
if(e.candidate){
socket.emit("ice-candidate",e.candidate);
}
};

pc.ontrack=e=>{
remoteAudio.srcObject=e.streams[0];
};

localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));
}

function startCall(){
addSystemCallCard("Calling...");
ringing.loop=true;
ringing.play();
socket.emit("call-request");
}

socket.on("incoming-call",()=>{
incomingRing.loop=true;
incomingRing.play();
addIncomingCallCard();
});

function addIncomingCallCard(){
const chat=document.getElementById("chat");
const div=document.createElement("div");
div.className="call-card";

div.innerHTML=`
<div>Incoming Call</div>
<div class="call-row">
<button class="call-btn-small accept" onclick="acceptCall()">Accept</button>
<button class="call-btn-small decline" onclick="declineCall()">Decline</button>
</div>
`;

chat.appendChild(div);
chat.scrollTop=chat.scrollHeight;
currentCallCard=div;
}

function addSystemCallCard(text){
const chat=document.getElementById("chat");
const div=document.createElement("div");
div.className="call-card";
div.innerHTML=`<div>${text}</div>`;
chat.appendChild(div);
chat.scrollTop=chat.scrollHeight;
currentCallCard=div;
}

function acceptCall(){
incomingRing.pause();
incomingRing.currentTime=0;
currentCallCard.innerHTML="Connecting...";
socket.emit("call-accepted");
}

function declineCall(){
incomingRing.pause();
incomingRing.currentTime=0;
currentCallCard.innerHTML="Call Declined";
socket.emit("call-declined");
}

socket.on("call-declined",()=>{
ringing.pause();
ringing.currentTime=0;
if(currentCallCard){
currentCallCard.innerHTML="Call Declined";
}
});

socket.on("call-accepted",async()=>{
ringing.pause();
ringing.currentTime=0;
await initMedia();
createPC();
const offer=await pc.createOffer();
await pc.setLocalDescription(offer);
socket.emit("offer",offer);
startTimer();
});

socket.on("offer",async(sdp)=>{
await initMedia();
createPC();
await pc.setRemoteDescription(new RTCSessionDescription(sdp));
const answer=await pc.createAnswer();
await pc.setLocalDescription(answer);
socket.emit("answer",answer);
startTimer();
});

socket.on("answer",async(sdp)=>{
await pc.setRemoteDescription(new RTCSessionDescription(sdp));
});

socket.on("ice-candidate",async(c)=>{
if(pc) await pc.addIceCandidate(new RTCIceCandidate(c));
});

socket.on("call-ended",()=>{
endCallCleanup();
});

function startTimer(){
callSeconds=0;
timerInterval=setInterval(()=>{
callSeconds++;
let m=Math.floor(callSeconds/60);
let s=callSeconds%60;
currentCallCard.innerHTML=`
<div class="call-row">
<span>In Call</span>
<span>${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}</span>
</div>
<button class="call-btn-small end" onclick="endCall()">End Call</button>
`;
},1000);
}

function endCall(){
socket.emit("call-ended");
endCallCleanup();
}

function endCallCleanup(){
if(pc){pc.close();pc=null;}
if(localStream){
localStream.getTracks().forEach(t=>t.stop());
localStream=null;
}
ringing.pause();
ringing.currentTime=0;
incomingRing.pause();
incomingRing.currentTime=0;
clearInterval(timerInterval);
if(currentCallCard){
currentCallCard.innerHTML="Call Ended";
}
}

</script>
</body>
</html>
